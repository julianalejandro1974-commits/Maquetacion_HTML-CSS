<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../Maquetacion_HTML-CSS/CSS/Sesion.css">

    <title>Inicio de Sesion SAMMY SPORTS</title>
</head>

<body>
    

    <div class="sesion">

        <div class="logo">
            🛡️
        </div>

        <h1>SAMMY SPORTS</h1>

        <h2>Portal de Acceso Administrativo</h2>

        <form action="datos" method="get">

            <div class="campo">
                <label for="correo">Correo / Usuario</label>

                <div class="input-contenedor">
                    <span class="icono">👤</span>

                    <input 
                        type="email" 
                        id="correo" 
                        name="correo" 
                        placeholder="admin@sammysports.com"
                        required
                    >
                </div>
            </div>


            <div class="campo">

                <div class="password-label">

                    <label for="contraseña">
                        Contraseña
                    </label>

                    <a href="Recuperarcontraseña.html" target="_blank">
                        Recuperar contraseña
                    </a>

                </div>

                <div class="input-contenedor">
                    <span class="icono">🔒</span>

                    <input 
                        type="password" 
                        id="contraseña" 
                        name="contraseña"
                        placeholder="••••••••"
                        required
                    >
                </div>

            </div>


            <button type="submit">
                Ingresar &nbsp;→
            </button>

        </form>


        <p class="seguridad">
            ♧ Entorno Seguro. Solo Personal Autorizado.
        </p>

    </div>

</body>

</html>

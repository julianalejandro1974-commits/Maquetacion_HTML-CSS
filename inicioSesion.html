<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="CSS/Sesion.css">

    <title>Inicio de Sesion SAMMY SPORTS</title>
</head>

<body>

    <div class="card sesion shadow-sm">

        <!-- LOGO -->
        <div class="logo">
            🛡️
        </div>

        <!-- TÍTULO -->
        <h1>
            SAMMY SPORTS
        </h1>

        <!-- SUBTÍTULO -->
        <h2>
            Portal de Acceso Administrativo
        </h2>

        <!-- FORMULARIO -->
        <form action="datos" method="get">

            <!-- CORREO -->
            <div class="campo mb-3">

                <label for="correo" class="form-label">
                    Correo / Usuario
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        👤
                    </span>

                    <input
                        type="email"
                        class="form-control"
                        id="correo"
                        name="correo"
                        placeholder="admin@sammysports.com"
                        required
                    >

                </div>

            </div>


            <!-- CONTRASEÑA -->
            <div class="campo mb-3">

                <div class="password-label">

                    <label for="contraseña" class="form-label">
                        Contraseña
                    </label>

                    <a href="Recuperarcontraseña.html" target="_blank">
                        Recuperar contraseña
                    </a>

                </div>

                <div class="input-group">

                    <span class="input-group-text">
                        🔒
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="contraseña"
                        name="contraseña"
                        placeholder="••••••••"
                        required
                    >

                </div>

            </div>


            <!-- BOTÓN -->
            <button
                type="submit"
                class="btn boton w-100"
            >
                Ingresar &nbsp;→
            </button>

        </form>


        <!-- SEGURIDAD -->
        <p class="seguridad">
            ♧ Entorno Seguro. Solo Personal Autorizado.
        </p>

    </div>

</body>

</html>
